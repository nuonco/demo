name: Nuon

on:
  push:
    branches: main
    paths:
      - "*"
  workflow_dispatch:

defaults:
  run:
    shell: bash
env:
  NUON_ORG_ID: ${{ secrets.NUON_ORG_ID }}
  NUON_API_TOKEN: ${{ secrets.NUON_API_TOKEN }}
  NUON_FILE: ${{ secrets.NUON_FILE }}

jobs:
  version:
    runs-on: ubuntu-latest
    name: version
    steps:
      - uses: actions/checkout@v4
      - name: CLI Version
        uses: nuonco/actions-nuon@fd/initial-attempt
        with:
          org_id: dne
          api_token: dne
          app_id: dne
          command: "version"
