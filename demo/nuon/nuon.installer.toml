#:schema https://api.nuon.co/v1/general/config-schema

version = "v1"
description = "This app is just here to hold the installer, because we can't put it in it's own config yet."
display_name = "Installer"

[runner]
runner_type = "aws-ecs"

[sandbox]
terraform_version = "1.7.5"
[sandbox.public_repo]
directory = "aws-ecs"
repo      = "nuonco/sandboxes"
branch    = "main"

[installer]
name              = "Nuon Demo Installer"
description       = "Installer for the Nuon Demo App."
documentation_url = "https://docs.nuon.co/quickstart"
community_url     = "https://nuon-byoc.slack.com/ssb/redirect"
homepage_url      = "https://nuon.co"
github_url        = "https://github.com/nuonco"
