#:schema https://api.nuon.co/v1/general/config-schema

version = "v1"
description = "Just here to hold the installer."
display_name = "Installer"

[runner]
runner_type = "aws-ecs"

[sandbox]
terraform_version = "1.7.5"
[sandbox.public_repo]
directory = "aws-ecs"
repo      = "nuonco/sandboxes"
branch    = "main"

