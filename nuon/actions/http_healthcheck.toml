#:schema https://api.nuon.co/v1/general/config-schema?source=action

name    = "http_healthcheck"
timeout = "0m15s"

[[triggers]]
type          = "cron"
cron_schedule = "*/5 * * * *"

[[steps]]
name    = "http_healthcheck"
command = "./http_healthcheck.py"
[steps.public_repo]
repo      = "nuonco/demo"
branch    = "ja/actions"
directory = "src/actions/http_healthcheck"
[steps.env_vars]
ENDPOINT             = "https://{{.nuon.install.inputs.service_name}}.{{.nuon.install.sandbox.outputs.public_domain.name}}"
METHOD               = "HEAD"
EXPECTED_STATUS_CODE = "200"
