#:schema https://api.nuon.co/v1/general/config-schema

version = "v1"
description = "Deploy an app to EKS in it's own VPC."
display_name = "Stand-Alone EKS Deployment"

[inputs]
source = "app_inputs.toml"

[runner]
runner_type = "aws-eks"

[sandbox]
terraform_version = "1.7.5"
[sandbox.public_repo]
directory = "aws-eks"
repo      = "nuonco/sandboxes"
branch    = "main"

[[components]]
source = "components/httpbin.toml"

[[components]]
source = "components/certificate.toml"

[[components]]
source = "components/helm_chart.toml"

[[actions]]
name = "k8s_logs_copy"

[[actions.triggers]]
type = "manual"

[[actions.steps]]
name = "step"
[actions.steps.public_repo]
directory = "src/scripts/k8s-logs.sh"
repo = "nuonco/demo"
branch = "main"
[actions.steps.env_vars]
POD = "{{ .nuon.install.inputs.service_name }}"
NAMESPACE = "{{ .nuon.install.id }}"
