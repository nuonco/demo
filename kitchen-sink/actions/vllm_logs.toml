#:schema https://api.nuon.co/v1/general/config-schema?source=action
name    = "vllm_logs"
timeout = "2m0s"

[[triggers]]
type = "manual"

[[steps]]
name    = "vllm-logs"
command = "./deployment-logs"

[steps.public_repo]
repo      = "nuonco/actions"
directory = "kube"
branch    = "main"

[steps.env_vars]
DEPLOYMENT_NAME      = "vllm-deepseek-vllm-chart"
DEPLOYMENT_NAMESPACE = "deepseek"
