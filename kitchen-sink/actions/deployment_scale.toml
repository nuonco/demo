#:schema https://api.nuon.co/v1/general/config-schema?source=action
name    = "deployment_scale"
timeout = "5m0s"

[[triggers]]
type = "manual"

[[steps]]
name    = "deployment_scale"
command = "./deployment_scale"

[steps.public_repo]
repo      = "nuonco/demo"
directory = "kitchen-sink/src/deployment_scale"
branch    = "main"

[steps.env_vars]
DEPLOYMENT = "vllm-deepseek-vllm-chart"
NAMESPACE  = "deepseek"
REPLICAS   = "1"
