#:schema https://api.nuon.co/v1/general/config-schema?source=terraform
name              = "wildcard_certificate"
type              = "terraform_module"
terraform_version = "1.10.4"

[public_repo]
repo      = "nuonco/components"
directory = "aws/certificate"
