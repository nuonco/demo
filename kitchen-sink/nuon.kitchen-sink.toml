## Developer Access to EKS

1. Add an access entry for the relevant role.
2. Grant the following perms: `AWSEKSAdmin`, `AWSClusterAdmin`
3. Add the cluster kubeconfig w/ the following command.
4. Use your tool of choice to access the cluster (`kubectl` or `k9s`).

```bash
{{ if .nuon.sandbox.outputs }}
aws --region {{ dig "outputs" "account" "region" "xx-vvvv-00" .nuon.sandbox  }} --profile test.NuonAdmin eks update-kubeconfig --name {{ .nuon.install.id }} --alias {{ .nuon.install.id }}
{{ else }}
lol
{{ end }}
```

```bash
kubectl config use-context {{.nuon.install.id}}
kubectl get --namespace {{.nuon.install.id}} deployments -o wide
```
