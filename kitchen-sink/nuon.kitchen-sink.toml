## Infra Components

### [RDS Subnet]({{.nuon.install.id}}/components/{{.nuon.components.components.rds_subnet.install_component_id}})

The `rds_subnet.toml` terraform component creates an RDS subnet group for use by
RDS resources. It is created as a standalone terraform module in order to make
it easy to mange and re-use it across different RDS resources. This de-coupling
makes it simpler to bundle changes into modular releases, a theme you will see
repeated throughout this configuration.

