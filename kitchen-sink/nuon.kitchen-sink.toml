### [Chat API Proxy]({{.nuon.install.id}}/components/{{.nuon.components.components.chat_api.install_component_id}})

A simple python api that proxies requests to the `vllm` deployment and stores
llm details in clickhouse.

This is intended to be used from within the cluster, but it can be access
locally like this:

```bash
kubectl port-forward svc/chat-api-service -n deepseek 9021:9021
curl -X POST http://localhost:9021/api/v1/chat/completions -H "Content-Type: application/json" --data '{
  "max_tokens": 512,
  "model": "deepseek-ai/DeepSeek-R1-Distill-Llama-8B",
  "messages": [
    {
      "role": "user",
      "content": "Why is the sky blue?"
    }
  ]
}'
```

