## Workloads

### Stateless Workloads

#### Whoami

Stateless services are a breeze. We deploy a simple service and make use of
several [nuon components](https://github.com/nuonco/components).

- Simple
  [whoami]({{.nuon.install.id}}/components/{{.nuon.components.components.whoami.install_component_id}})
  Server
- [AWS ALB Ingress]({{.nuon.install.id}}/components/{{.nuon.components.components.alb.install_component_id}})
  ([link](https://chat.{{.nuon.sandbox.outputs.public_domain.name}}))

- [Wildcard Certificate]({{.nuon.install.id}}/components/{{.nuon.components.components.wildcard_certificate.install_component_id}})

We support wildcard and sub/domain ACM certs. Out of the box, the sandboxes
support a nuon provided `nuon.run` domain for your application.

### [Deepseek Chat UI]({{.nuon.install.id}}/components/{{.nuon.components.components.deepseek_chat_ui.install_component_id}})

