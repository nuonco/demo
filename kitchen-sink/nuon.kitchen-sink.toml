## Configuring Custom DNS

If you want to configure custom DNS, you can use the
[nuon alb component]({{.nuon.install.id}}/components/{{.nuon.components.components.alb.install_component_id}}),
or bake your own, and use it's outputs or an action,
[like this one](https://github.com/nuonco/actions/blob/main/aws/alb-healthcheck),
to polls its state and populate a readme. The example below uses our nuon alb
healthcheck action.

{{ if .nuon.actions.workflows.whoami_alb_healthcheck.outputs }}
{{ $ingressLB :=  (index .nuon.actions.workflows.whoami_alb_healthcheck.outputs "status" "loadBalancer" "ingress" 0 "hostname" ) }}

- Load Balancer URL: `{{ $ingressLB }}`

Create a CNAME record pointing your desired domain to your alb ALB. e.g.

```txt
whoami.your-subdomain.example.com => {{ $ingressLB }}
```
{{ else }}
```
⏳ Waiting on load balancer...
```
{{ end }}

