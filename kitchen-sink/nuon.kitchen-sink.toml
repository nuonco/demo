## Cluster Level Dependencies

### Secrets Operator

It is recommended secrets are kept out of outputs. To that end, the RDS cluster
uses an AWS managed password which is stored in Secret Manager. These secrets
can be read with the [External Secrets](https://charts.external-secrets.io/).
This dependency is managed via two components. One for the CRDs (terraform) and
one for the k8s resources (helm). This enables use to explicitly manage CRD
versions which is important when it comes time to apply updates.

- [`external_secrets_crds`]({{.nuon.install.id}}/components/{{.nuon.components.components.external_secrets_crds.install_component_id}})
- [`external_secrets`]({{.nuon.install.id}}/components/{{.nuon.components.components.external_secrets.install_component_id}})

### Clickhouse Operator

We deploy the
[`altinity/clickhouse-operator`](https://github.com/Altinity/clickhouse-operator/)
which makes it easy to deploy clickhouse instances.

- [`clickhouse_operator`]({{.nuon.install.id}}/components/{{.nuon.components.components.clickhouse_operator.install_component_id}})
- [`clickhouse_operator`]({{.nuon.install.id}}/components/{{.nuon.components.components.clickhouse_operator.install_component_id}})

