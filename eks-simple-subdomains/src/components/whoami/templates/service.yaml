apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: {{ .Values.namespace | default .Release.Namespace | quote }}
spec:
  ports:
  - name: http-whoami
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: {{ .Values.deployment.containerPort }}
  selector:
    app: whoami
  sessionAffinity: None
  type: ClusterIP
